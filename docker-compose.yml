services:
  avmsolutions:
    build: .
    image: avmsolutions:latest
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # All environment variables are sourced from .env via env_file above.
    volumes:
      # Local CSV volumes are optional in S3 mode. Keep mounts for backward compatibility.
      - ./CSVex:/data/CSVex
      - ./csvex_enriched:/data/CSVex_enriched
      - ./CSVex_s3:/app/CSVex_s3
      - ./knowledge:/app/knowledge:ro
    ports:
      - "3000:3000"

  # Optional local Neo4j service for development.
  # If you prefer to connect to an external Neo4j (e.g., Aura), you can ignore this service.
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      # Ensure Neo4j starts with a known password for local dev
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/testtest}
    # NEO4J_AUTH will be sourced from .env if present
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    volumes:
      - ./chroma:/chroma
    ports:
      - "8000:8000"
