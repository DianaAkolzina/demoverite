services:
  avmsolutions:
    build: .
    image: avmsolutions:latest
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CSV_DIR=/data/CSVex_enriched
      - CSV_SOURCE_DIR=/data/CSVex
      - CSV_TARGET_DIR=/data/CSVex_enriched
      - SKIP_INGEST=0
      # OpenWeather settings (optional)
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_LAT=${OPENWEATHER_LAT:-51.5072}
      - OPENWEATHER_LON=${OPENWEATHER_LON:-0.1276}
      - OPENWEATHER_BACKFILL_DAYS=5
    volumes:
      - ./CSVex:/data/CSVex:ro
      - ./csvex_enriched:/data/CSVex_enriched
      - ./knowledge:/app/knowledge:ro
    ports:
      - "3000:3000"
